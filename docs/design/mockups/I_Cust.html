<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 I 손님 화면</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3182f6}a:hover{color:#1b64da}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; font-family: 'Noto Sans KR', sans-serif; color: #191f28; display: flex; flex-direction: column; overflow: hidden; position: relative"><div style="height: 54px; flex: none; background: #f2f4f6; display: flex; align-items: flex-end; padding: 0 14px 8px"><div style="flex: 1; height: 34px; border-radius: 10px; background: #e5e8eb; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6b7684"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>kimminho93.github.io</div></div><main style="flex: 1; padding: 34px 22px 0; display: flex; flex-direction: column">
    <span style="font-size: 15px; color: #6b7684">계좌이체 안내</span><h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800">우리분식 본점</h1>
    <section style="margin-top: 26px; border-radius: 20px; background: #f2f4f6; padding: 4px 18px">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 56px; border-top: 0"><span style="font-size: 15px; color: #6b7684">은행</span><span class="num" style="font-size: 17px; font-weight: 800">예시은행</span></div><div style="display: flex; justify-content: space-between; align-items: center; height: 56px; border-top: 1px solid #e5e8eb"><span style="font-size: 15px; color: #6b7684">계좌번호</span><span class="num" style="font-size: 20px; font-weight: 800">1234-56-789012</span></div><div style="display: flex; justify-content: space-between; align-items: center; height: 56px; border-top: 1px solid #e5e8eb"><span style="font-size: 15px; color: #6b7684">예금주</span><span class="num" style="font-size: 17px; font-weight: 800">우리분식</span></div>
    </section>
    <p style="margin: 16px 2px 0; display: flex; gap: 8px; font-size: 14px; line-height: 1.5; color: #4e5968"><span style="color: #3182f6; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span>송금하기 전에 받는 분 이름이 <b>우리분식</b>인지 꼭 확인하세요.</span></p>
    <div style="flex: 1"></div>
    <p style="margin: 0 2px 14px; font-size: 13px; line-height: 1.5; color: #8b95a1">복사한 뒤 쓰시는 은행 앱이나 토스·카카오페이를 열면 계좌번호를 붙여 넣을 수 있어요.</p>
  </main>
  <div style="padding: 0 20px 34px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 56px; border-radius: 16px; border: 0; background: #3182f6; color: #fff; font: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>계좌번호 복사</button>
    <button type="button" style="height: 48px; border-radius: 16px; border: 0; background: #f2f4f6; color: #4e5968; font: inherit; font-size: 15px; font-weight: 700">은행 이름까지 복사</button>
  </div></div>
</body>
</html>
