<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 M 손님 화면</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3182f6}a:hover{color:#1b64da}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f2f4f6; font-family: 'Noto Sans KR', sans-serif; color: #191f28; display: flex; flex-direction: column; overflow: hidden; position: relative"><div style="height: 54px; flex: none; background: #f2f4f6; display: flex; align-items: flex-end; padding: 0 14px 8px"><div style="flex: 1; height: 34px; border-radius: 10px; background: #e5e8eb; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6b7684"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>kimminho93.github.io</div></div><main style="flex: 1; padding: 30px 18px 0; background: #f2f4f6; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #fff; border-radius: 24px; overflow: hidden">
      <div style="padding: 22px 22px 18px; display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; border-radius: 22px; background: #3182f6; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800">우</span><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">우리분식 본점</span><span style="font-size: 13px; color: #6b7684">계좌이체 안내</span></span></div>
      <div style="height: 0; border-top: 2px dashed #e5e8eb; margin: 0 14px"></div>
      <div style="padding: 18px 22px 22px">
        <div class="num" style="font-size: 28px; font-weight: 800">1234-56-789012</div>
        <div style="margin-top: 6px; font-size: 15px; color: #4e5968">예시은행 · 예금주 <b>우리분식</b></div>
        <div style="margin-top: 18px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px">
          <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #3182f6; color: #fff; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>계좌번호 복사</button>
          <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #f2f4f6; color: #4e5968; font: inherit; font-size: 14px; font-weight: 700">은행명까지</button>
        </div>
      </div>
    </section>
    <div style="display: flex; gap: 10px; padding: 0 6px; font-size: 14px; line-height: 1.5; color: #4e5968"><span style="color: #3182f6; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span><span>송금하기 전에 받는 분 이름이 <b>우리분식</b>인지 꼭 확인하세요.</span></div>
    <div style="display: flex; gap: 10px; padding: 0 6px; font-size: 14px; line-height: 1.5; color: #6b7684"><span style="flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="3"/><path d="M10 7h4"/></svg></span><span>복사한 뒤 쓰시는 은행 앱이나 토스·카카오페이를 열면 계좌번호를 붙여 넣을 수 있어요.</span></div>
    <div style="flex: 1"></div>
    <p style="margin: 0 0 24px; text-align: center; font-size: 12px; color: #b0b8c1">이 페이지는 계좌 정보를 저장하거나 보내지 않아요</p>
  </main></div>
</body>
</html>
