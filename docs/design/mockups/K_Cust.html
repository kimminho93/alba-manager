<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 K 손님 화면</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3182f6}a:hover{color:#1b64da}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; font-family: 'Noto Sans KR', sans-serif; color: #191f28; display: flex; flex-direction: column; overflow: hidden; position: relative"><div style="height: 54px; flex: none; background: #f2f4f6; display: flex; align-items: flex-end; padding: 0 14px 8px"><div style="flex: 1; height: 34px; border-radius: 10px; background: #e5e8eb; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6b7684"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>kimminho93.github.io</div></div><main style="flex: 1; padding: 40px 24px 0; display: flex; flex-direction: column; align-items: center; text-align: center">
    <span style="width: 56px; height: 56px; border-radius: 18px; background: #e8f3ff; color: #3182f6; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></span>
    <span style="margin-top: 16px; font-size: 15px; color: #6b7684">우리분식 본점 계좌이체</span>
    <span style="margin-top: 22px; font-size: 16px; font-weight: 700">예시은행</span>
    <span class="num" style="margin-top: 4px; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">1234-56-789012</span>
    <span style="margin-top: 10px; font-size: 16px; color: #4e5968">예금주 <b>우리분식</b></span>
    <p style="margin: 26px 0 0; padding: 14px 16px; border-radius: 16px; background: #f2f4f6; font-size: 14px; line-height: 1.55; color: #4e5968">송금하기 전에 받는 분 이름이 <b>우리분식</b>인지 꼭 확인하세요.<br><span style="color: #8b95a1">복사한 뒤 쓰시는 은행 앱이나 토스·카카오페이를 열면 계좌번호를 붙여 넣을 수 있어요.</span></p>
  </main>
  <div style="padding: 0 20px 34px; display: flex; gap: 8px">
    <button type="button" style="flex: 1; height: 56px; border-radius: 16px; border: 0; background: #f2f4f6; color: #4e5968; font: inherit; font-size: 14px; font-weight: 700">은행명까지 복사</button>
    <button type="button" style="flex: 1.6; height: 56px; border-radius: 16px; border: 0; background: #3182f6; color: #fff; font: inherit; font-size: 17px; font-weight: 800">계좌번호 복사</button>
  </div></div>
</body>
</html>
