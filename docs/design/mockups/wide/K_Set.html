<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 K 넓은 화면 설정</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #f2f4f6; color: #191f28;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .num { font-family: Inter, 'Noto Sans KR', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }

  .app { display: flex; width: 100%; height: 100vh; overflow: hidden; }

  /* 시안 K 개성: 떠 있는 둥근 흰 왼쪽 메뉴 */
  .nav-wrap { flex: none; padding: 16px 0 16px 16px; display: flex; }
  .sidenav {
    width: 88px; background: #fff; border-radius: 28px;
    box-shadow: 0 8px 28px rgba(25, 31, 40, 0.10);
    padding: 12px 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .brand {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 6px 4px 12px; border-bottom: 1px solid #f2f4f6; margin-bottom: 4px;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 14px;
    background: #e8f3ff; color: #3182f6;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .brand-text { display: none; min-width: 0; }
  .brand-name { font-size: 15px; font-weight: 800; color: #191f28; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 12px; color: #8b95a1; margin-top: 1px; }
  .nav-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; padding: 11px 4px; border-radius: 18px;
    color: #8b95a1; font-size: 11px; font-weight: 800;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: #f2f4f6; color: #4e5968; }
  .nav-item[aria-current="page"] { background: #191f28; color: #fff; }
  .nav-foot {
    padding-top: 10px; border-top: 1px solid #f2f4f6;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 12px; font-weight: 700; color: #6b7684;
  }
  .nav-sync-label { display: none; }
  .dot-ok { width: 8px; height: 8px; border-radius: 50%; background: #3182f6; flex: none; }

  /* 오른쪽 메인 영역 */
  .stage {
    flex: 1; min-width: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
    padding: 20px 24px 28px 20px; display: flex; flex-direction: column; gap: 16px;
  }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .page-title { margin: 0; font-size: 24px; font-weight: 800; }
  .ver-pill {
    height: 32px; padding: 0 12px; border-radius: 14px; background: #fff;
    font-size: 12.5px; font-weight: 700; color: #6b7684;
    display: inline-flex; align-items: center; gap: 6px;
  }

  /* 상단 매장 프로필 카드 */
  .store-card {
    background: #fff; border-radius: 22px; padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04);
  }
  .store-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .store-icon {
    width: 50px; height: 50px; border-radius: 17px; background: #e8f3ff; color: #3182f6;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .store-name { font-size: 18px; font-weight: 800; }
  .store-meta { font-size: 13px; color: #6b7684; margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sync-ok { color: #1b64da; font-weight: 800; }
  .store-actions { display: flex; align-items: center; gap: 8px; }
  .pill-btn {
    height: 38px; padding: 0 14px; border-radius: 13px; border: 0;
    background: #f2f4f6; color: #4e5968; font-size: 13px; font-weight: 800;
  }
  .pill-btn:hover { background: #e5e8eb; color: #191f28; }
  .pill-btn.blue { background: #e8f3ff; color: #1b64da; }

  /* 시안 K 개성: 위에 빠른 버튼 4개 가로 */
  .quick-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
  }
  .quick-btn {
    background: #fff; border: 0; border-radius: 22px; padding: 16px 18px;
    display: flex; align-items: center; gap: 14px; text-align: left;
    color: #191f28; box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04);
    transition: background .15s, transform .12s;
  }
  .quick-btn:hover { transform: translateY(-2px); }
  .quick-btn.active { background: #191f28; color: #fff; }
  .quick-ico {
    width: 44px; height: 44px; border-radius: 15px; background: #e8f3ff; color: #3182f6;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .quick-btn.active .quick-ico { background: rgba(255, 255, 255, 0.16); color: #fff; }
  .quick-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .quick-title { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .quick-sub { font-size: 12px; color: #8b95a1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-btn.active .quick-sub { color: rgba(255, 255, 255, 0.78); }

  /* 시안 K 개성: 아래 설정 카드 3열 격자 */
  .set-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
    align-items: start;
  }
  .set-card {
    background: #fff; border-radius: 22px; padding: 16px 16px 8px;
    box-shadow: 0 2px 10px rgba(25, 31, 40, 0.04);
    display: flex; flex-direction: column; min-width: 0;
  }
  .card-label {
    font-size: 13px; font-weight: 800; color: #8b95a1;
    padding: 0 4px 10px; border-bottom: 1px solid #f2f4f6;
  }

  .set-row {
    display: flex; align-items: center; gap: 11px;
    padding: 13px 4px; border-top: 1px solid #f2f4f6;
    background: transparent; border-left: 0; border-right: 0; border-bottom: 0;
    text-align: left; width: 100%; color: #191f28;
  }
  .set-row:first-of-type { border-top: 0; }
  .set-row:hover { color: #3182f6; }
  .row-ico { color: #6b7684; flex: none; display: flex; align-items: center; }
  .row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 14.5px; font-weight: 700; }
  .row-desc { font-size: 12px; color: #8b95a1; font-weight: 500; line-height: 1.35; }
  .row-val { font-size: 12.5px; font-weight: 700; color: #3182f6; white-space: nowrap; flex: none; }
  .row-val.muted { color: #8b95a1; }
  .chev { color: #b0b8c1; flex: none; }

  @media (min-width: 1300px) {
    .sidenav { width: 220px; padding: 16px 12px; }
    .brand { flex-direction: row; align-items: center; gap: 10px; padding: 6px 8px 16px; }
    .brand-text { display: flex; flex-direction: column; }
    .nav-item { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 13px 14px; font-size: 15px; }
    .nav-foot { justify-content: flex-start; padding: 12px 10px 4px; }
    .nav-sync-label { display: inline; }
    .stage { padding: 24px 32px 28px 24px; gap: 18px; }
    .set-card { padding: 18px 20px 10px; }
    .set-row { padding: 15px 4px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="nav-wrap">
    <nav class="sidenav" aria-label="주 메뉴">
      <div class="brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">우리분식 본점</span>
          <span class="brand-sub">사장 김사장</span>
        </div>
      </div>
      <div class="nav-list">
        <a class="nav-item" href="K_Punch.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>출퇴근</span>
        </a>
        <a class="nav-item" href="K_Pay.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>
          <span>근무·급여</span>
        </a>
        <a class="nav-item" href="K_Chk.html">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>위생 점검</span>
        </a>
        <a class="nav-item" href="K_Set.html" aria-current="page">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span>설정</span>
        </a>
      </div>
      <div class="nav-foot" title="구글 시트 자동 저장 연결됨">
        <span class="dot-ok" aria-hidden="true"></span>
        <span class="nav-sync-label">구글 시트 연결됨</span>
      </div>
    </nav>
  </div>

  <main class="stage">
    <header class="topbar">
      <h1 class="page-title">설정</h1>
      <span class="ver-pill num">사장님 도우미 v1.7.1</span>
    </header>

    <section class="store-card" aria-label="매장 정보 및 구글 시트 자동 저장">
      <div class="store-left">
        <span class="store-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <div>
          <div class="store-name">우리분식 본점</div>
          <div class="store-meta">
            <span>사장 김사장</span>
            <span>·</span>
            <span class="sync-ok">구글 시트 자동 저장 연결됨</span>
            <span>· 방금 저장됨</span>
          </div>
        </div>
      </div>
      <div class="store-actions">
        <button type="button" class="pill-btn blue">구글 시트 관리</button>
        <button type="button" class="pill-btn">매장 정보 수정</button>
      </div>
    </section>

    <!-- 빠른 버튼 4개 가로 -->
    <section class="quick-grid" aria-label="빠른 설정 버튼">
      <button type="button" class="quick-btn" id="qLang">
        <span class="quick-ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        </span>
        <span class="quick-txt">
          <span class="quick-title" id="qLangTitle">한국어</span>
          <span class="quick-sub" id="qLangSub">English로 전환</span>
        </span>
      </button>

      <button type="button" class="quick-btn" id="qFont">
        <span class="quick-ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>
        </span>
        <span class="quick-txt">
          <span class="quick-title">글자 크게</span>
          <span class="quick-sub" id="qFontSub">보통 크기</span>
        </span>
      </button>

      <button type="button" class="quick-btn" id="qDark">
        <span class="quick-ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/></svg>
        </span>
        <span class="quick-txt">
          <span class="quick-title">다크 모드</span>
          <span class="quick-sub" id="qDarkSub">밝은 화면</span>
        </span>
      </button>

      <button type="button" class="quick-btn" id="qGuide">
        <span class="quick-ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>
        </span>
        <span class="quick-txt">
          <span class="quick-title">사용 방법</span>
          <span class="quick-sub">가이드 14개 보기</span>
        </span>
      </button>
    </section>

    <!-- 아래 설정 카드 3열 격자 -->
    <section class="set-grid" aria-label="전체 설정 항목">
      <!-- 1열: 매장·기기 -->
      <article class="set-card">
        <div class="card-label">매장 · 기기</div>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16"/><path d="M9 20v-6h6v6"/></svg></span>
          <span class="row-body">
            <span class="row-title">매장 정보</span>
            <span class="row-desc">매장명 · 사장님 이름</span>
          </span>
          <span class="row-val muted">우리분식</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <span class="row-body">
            <span class="row-title">관리자 비밀번호</span>
            <span class="row-desc">출퇴근 외 탭 잠금 · PIN 변경</span>
          </span>
          <span class="row-val">설정됨</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></span>
          <span class="row-body">
            <span class="row-title">출퇴근 기기</span>
            <span class="row-desc">매장 공용 기기 지정 · 해제</span>
          </span>
          <span class="row-val">이 기기</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <a class="set-row" href="K_QR.html">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg></span>
          <span class="row-body">
            <span class="row-title">손님 계좌이체 QR</span>
            <span class="row-desc">은행·계좌 저장 · QR 보기 · 인쇄</span>
          </span>
          <span class="row-val">예시은행</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h11a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 6.8 9.2 3.8 3.8 0 0 0 6 18z"/></svg></span>
          <span class="row-body">
            <span class="row-title">구글 시트 자동 저장</span>
            <span class="row-desc">연결·해제 · 동기화 충돌 확인</span>
          </span>
          <span class="row-val">연결됨</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </article>

      <!-- 2열: 출퇴근 -->
      <article class="set-card">
        <div class="card-label">출퇴근 기준</div>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5h4"/></svg></span>
          <span class="row-body">
            <span class="row-title">출퇴근 시간 끊기</span>
            <span class="row-desc">출근 올림 · 퇴근 내림 · 지각/조기 봐주기</span>
          </span>
          <span class="row-val num">30분</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/></svg></span>
          <span class="row-body">
            <span class="row-title">자동 퇴근 시각</span>
            <span class="row-desc">미퇴근 시 자동 처리 후 확인 목록 이동</span>
          </span>
          <span class="row-val num">23:30</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="set-row">
          <span class="row-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></span>
          <span class="row-body">
            <span class="row-title">알림음</span>
            <span class="row-desc">소리 크기 · 출근/퇴근 소리 · 미리 듣기 (이 기기)</span>
          </span>
          <span class="row-val">켜짐</span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="set-row">

<script>
  (function () {
    var qLang = document.getElementById('qLang');
    var qLangTitle = document.getElementById('qLangTitle');
    var qLangSub = document.getElementById('qLangSub');
    qLang.addEventListener('click', function () {
      var en = qLang.classList.toggle('active');
      qLangTitle.textContent = en ? 'English' : '한국어';
      qLangSub.textContent = en ? '한국어로 전환' : 'English로 전환';
    });

    var qFont = document.getElementById('qFont');
    var qFontSub = document.getElementById('qFontSub');
    qFont.addEventListener('click', function () {
      var big = qFont.classList.toggle('active');
      qFontSub.textContent = big ? '큰 글자 켜짐' : '보통 크기';
    });

    var qDark = document.getElementById('qDark');
    var qDarkSub = document.getElementById('qDarkSub');
    qDark.addEventListener('click', function () {
      var on = qDark.classList.toggle('active');
      qDarkSub.textContent = on ? '어두운 화면' : '밝은 화면';
    });
  })();
</script>
