<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 L 넓은 화면 계좌이체 QR</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #3182f6; color: #fff; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .num { font-family: Inter, 'Noto Sans KR', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }

  .qr-page {
    width: 100%; height: 100vh; background: #3182f6; color: #fff;
    display: flex; flex-direction: column; padding: 24px 36px 32px; overflow: hidden;
  }

  .qr-top {
    display: flex; align-items: center; justify-content: space-between; flex: none;
  }
  .store-badge { display: flex; align-items: center; gap: 10px; }
  .store-name { font-size: 20px; font-weight: 800; }
  .store-tag {
    padding: 4px 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.18);
    font-size: 13px; font-weight: 700;
  }

  .close-btn {
    height: 44px; padding: 0 18px; border-radius: 22px; border: 0;
    background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 15px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.28); }

  /* 가운데 정렬 + 아주 큰 글자의 계좌번호 (시안 L 개성) */
  .qr-center {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 20px; min-height: 0;
  }

  .qr-heading {
    margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.3;
  }
  @media (min-width: 1300px) {
    .qr-heading { font-size: 36px; }
  }

  .qr-card {
    padding: 18px; border-radius: 32px; background: #fff;
    box-shadow: 0 18px 48px rgba(13, 55, 130, 0.22);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .qr-svg { width: 268px; height: 268px; display: block; }
  @media (min-width: 1300px) {
    .qr-svg { width: 300px; height: 300px; }
  }

  .account-block { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 4px; }
  .account-number {
    font-size: 38px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15;
  }
  @media (min-width: 1300px) {
    .account-number { font-size: 46px; }
  }
  .account-holder {
    font-size: 20px; font-weight: 700; opacity: 0.92;
  }
  .account-note {
    font-size: 14px; opacity: 0.8; margin-top: 2px;
  }

  .qr-actions {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 8px;
  }
  .copy-btn {
    height: 56px; padding: 0 34px; border-radius: 18px; border: 0;
    background: #fff; color: #1b64da; font-size: 17px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-width: 240px;
  }
  .copy-btn:hover { background: #e8f3ff; }
  .print-btn {
    height: 56px; padding: 0 26px; border-radius: 18px; border: 0;
    background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 16px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .print-btn:hover { background: rgba(255, 255, 255, 0.28); }
</style>
</head>
