<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 J 넓은 화면 계좌이체 QR</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f2f4f6;
  color: #191f28;
  font-family: 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
.num {
  font-family: Inter, 'Noto Sans KR', sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}

.qr-page {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 22px 32px 28px;
  overflow-y: auto;
  overflow-x: hidden;
}

.qr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.store-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.store-badge {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  background: #3182f6;
  color: #ffffff;
  font-size: 17px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}
.store-title {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  color: #191f28;
}
.store-sub {
  font-size: 13px;
  font-weight: 600;
  color: #6b7684;
  margin-top: 2px;
}
.head-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.print-btn {
  height: 44px;
  padding: 0 18px;
  border-radius: 14px;
  border: 0;
  background: #ffffff;
  color: #4e5968;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.print-btn:hover { background: #e5e8eb; color: #191f28; }
.close-btn {
  height: 44px;
  padding: 0 16px;
  border-radius: 14px;
  border: 0;
  background: #ffffff;
  color: #191f28;
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.close-btn:hover { background: #e5e8eb; }

/* 가운데 큰 QR + 아래 계좌와 큰 [계좌번호 복사] */
.qr-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 0;
}

.qr-card {
  width: 100%;
  max-width: 520px;
  background: #ffffff;
  border-radius: 28px;
  padding: 28px 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.qr-svg {
  width: clamp(230px, 34vh, 300px);
  height: clamp(230px, 34vh, 300px);
  display: block;
}
.qr-guide {
  font-size: 18px;
  font-weight: 800;
  color: #191f28;
  text-align: center;
}
.qr-sub {
  font-size: 14px;
  font-weight: 500;
  color: #6b7684;
  text-align: center;
  margin-top: -6px;
}

.account-card {
  width: 100%;
  max-width: 520px;
  background: #191f28;
  color: #ffffff;
  border-radius: 26px;
  padding: 22px 26px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.account-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.bank-owner {
  font-size: 15px;
  font-weight: 600;
  color: #b0b8c1;
}
.owner-pill {
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
  font-size: 12px;
  font-weight: 700;
}
.account-number {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #ffffff;
  line-height: 1.1;
}
.copy-btn {
  width: 100%;
  height: 58px;
  border-radius: 16px;
  border: 0;
  background: #3182f6;
  color: #ffffff;
  font-size: 17px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.15s;
}
.copy-btn:hover { background: #1b64da; }
.copy-btn.copied { background: #1b64da; }
</style>
</head>
