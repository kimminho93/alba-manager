<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 K 넓은 화면 계좌이체 QR</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #ffffff; color: #191f28;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  .num { font-family: Inter, 'Noto Sans KR', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }

  /* 시안 K 개성: 화면 가득 밝은 바탕에 큰 QR과 '화면을 밝게 해 두었어요' 안내 */
  .qr-screen {
    width: 100%; height: 100vh; background: #fff;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .qr-top {
    flex: none; padding: 22px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .bright-pill {
    height: 40px; padding: 0 16px; border-radius: 20px; background: #f2f4f6;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: #4e5968;
  }
  .bright-pill svg { color: #3182f6; }
  .close-link {
    height: 44px; padding: 0 18px; border-radius: 22px; background: #f2f4f6;
    color: #191f28; font-size: 15px; font-weight: 800;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .close-link:hover { background: #e5e8eb; }

  .qr-stage {
    flex: 1; min-height: 0; padding: 0 48px 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .qr-layout {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    align-items: center; gap: 56px;
  }

  .qr-card {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: 26px; border-radius: 32px; background: #fff;
    border: 1.5px solid #e5e8eb; box-shadow: 0 14px 40px rgba(25, 31, 40, 0.08);
  }
  .qr-svg { width: 320px; height: 320px; display: block; }
  .qr-tip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 700; color: #6b7684;
  }

  .info-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .store-badge {
    align-self: flex-start; padding: 6px 14px; border-radius: 14px;
    background: #e8f3ff; color: #1b64da; font-size: 14px; font-weight: 800;
  }
  .headline {
    margin: 0; font-size: 40px; font-weight: 800; line-height: 1.28; letter-spacing: -1px;
  }

  .account-box {
    background: #f2f4f6; border-radius: 24px; padding: 22px 26px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .acct-meta { font-size: 16px; font-weight: 700; color: #6b7684; }
  .acct-num { font-size: 32px; font-weight: 800; color: #191f28; letter-spacing: -0.6px; }

  .actions { display: flex; align-items: center; gap: 12px; }
  .btn-copy {
    flex: 1; height: 58px; border-radius: 18px; border: 0;
    background: #3182f6; color: #fff; font-size: 17px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-copy:hover { background: #1b64da; }
  .btn-print {
    height: 58px; padding: 0 22px; border-radius: 18px; border: 1.5px solid #e5e8eb;
    background: #fff; color: #4e5968; font-size: 16px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  }
  .btn-print:hover { background: #f2f4f6; color: #191f28; }

  .foot-note { font-size: 14px; color: #8b95a1; margin: 0; line-height: 1.5; }

  @media (min-width: 1300px) {
    .qr-top { padding: 26px 44px; }
    .qr-layout { max-width: 1060px; gap: 72px; }
    .qr-svg { width: 370px; height: 370px; }
    .headline { font-size: 46px; }
    .acct-num { font-size: 36px; }
  }
</style>
</head>

          휴대폰 기본 카메라로 찍으면 돼요
        </span>
      </div>

      <section class="info-col" aria-label="입금 계좌 정보">
        <span class="store-badge">우리분식 본점</span>
        <h1 class="headline">계좌이체는<br>여기를 찍어 주세요</h1>

        <div class="account-box">
          <span class="acct-meta">예시은행 · 예금주 우리분식</span>
          <span class="acct-num num">1234-56-789012</span>
        </div>

        <div class="actions">
          <button type="button" class="btn-copy" id="btnCopy">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
            <span id="copyLabel">계좌번호 복사</span>
          </button>
          <button type="button" class="btn-print" onclick="window.print()">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>
            안내판 인쇄
          </button>
        </div>

        <p class="foot-note">계산대에 태블릿을 세워 두고 손님이 카메라로 찍으면 바로 계좌번호를 복사할 수 있어요.</p>
      </section>
    </div>
  </main>
</div>

<script>
  (function () {
    var btn = document.getElementById('btnCopy');
    var label = document.getElementById('copyLabel');
    var timer;
    btn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText('1234-56-789012').catch(function () {});
      }
      label.textContent = '계좌번호를 복사했어요';
      clearTimeout(timer);
      timer = setTimeout(function () { label.textContent = '계좌번호 복사'; }, 1800);
    });
  })();
</script>
