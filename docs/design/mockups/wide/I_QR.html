<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 I 넓은 화면 계좌이체 QR</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #f2f4f6;
  font-family: 'Noto Sans KR', sans-serif;
  color: #191f28;
}
button, a { font: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
.num {
  font-family: Inter, 'Noto Sans KR', sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}

.qr-page {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 상단 바 */
.qr-header {
  padding: 20px 32px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.qr-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.qr-header h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
}
.qr-pill {
  padding: 5px 11px;
  border-radius: 999px;
  background: #fff;
  color: #6b7684;
  font-size: 12px;
  font-weight: 700;
}
.close-btn {
  height: 42px;
  padding: 0 16px;
  border-radius: 21px;
  background: #fff;
  color: #4e5968;
  font-size: 14px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.close-btn:hover { background: #e5e8eb; }

/* 중앙 2단 배치: 왼쪽 큰 QR, 오른쪽 가게명·계좌·복사·인쇄 */
.qr-stage {
  flex: 1;
  min-height: 0;
  padding: 24px 36px 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}
.qr-grid {
  width: 100%;
  max-width: 980px;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: 24px;
  align-items: stretch;
}

/* 왼쪽 큰 QR 카드 */
.qr-card {
  background: #fff;
  border-radius: 28px;
  padding: 36px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.qr-prompt {
  font-size: 24px;
  font-weight: 800;
  color: #191f28;
}
.qr-frame {
  margin-top: 22px;
  padding: 18px;
  border-radius: 24px;
  border: 1px solid #e5e8eb;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qr-svg {
  width: 280px;
  height: 280px;
  display: block;
}
@media (min-width: 1300px) {
  .qr-svg { width: 320px; height: 320px; }
}
.qr-caption {
  margin-top: 18px;
  font-size: 14px;
  color: #8b95a1;
  font-weight: 500;
}

/* 오른쪽 가게명·계좌·복사·인쇄 */
.info-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.account-card {
  flex: 1;
  background: #fff;
  border-radius: 28px;
  padding: 34px 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.store-kicker {
  font-size: 13px;
  font-weight: 800;
  color: #3182f6;
}
.store-name {
  margin: 6px 0 0;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.8px;
  color: #191f28;
}
.divider {
  height: 1px;
  background: #f2f4f6;
  margin: 24px 0;
}
.bank-meta {
  font-size: 15px;
  font-weight: 600;
  color: #6b7684;
}
.acct-num {
  margin-top: 6px;
  font-size: 28px;
  font-weight: 800;
  color: #191f28;
  letter-spacing: -0.5px;
}
.copy-btn {
  margin-top: 24px;
  width: 100%;
  height: 54px;
  border-radius: 16px;
  border: 0;
  background: #e8f3ff;
  color: #1b64da;
  font-size: 16px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background 0.15s, color 0.15s;
}
.copy-btn:hover { background: #d4e8ff; }
.copy-btn.copied { background: #3182f6; color: #fff; }

.holder-tip {
  margin-top: 14px;
  font-size: 13px;
  color: #8b95a1;
  line-height: 1.5;
}

.print-card {
  background: #fff;
  border-radius: 22px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.print-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.print-title { font-size: 16px; font-weight: 800; color: #191f28; }
.print-sub { font-size: 13px; color: #8b95a1; }
.print-btn {
  height: 46px;
  padding: 0 20px;
  border-radius: 14px;
  border: 0;
  background: #191f28;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.print-btn:hover { background: #333d4b; }
</style>
</head>

<script>
(function () {
  var btn = document.getElementById('copyAcctBtn');
  var txt = document.getElementById('copyAcctText');
  var timer = null;
  btn.addEventListener('click', function () {
    btn.classList.add('copied');
    txt.textContent = '계좌번호를 복사했어요';
    clearTimeout(timer);
    timer = setTimeout(function () {
      btn.classList.remove('copied');
      txt.textContent = '계좌번호 복사';
    }, 1800);
  });
})();
</script>
