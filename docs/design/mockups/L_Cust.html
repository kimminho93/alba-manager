<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 L 손님 화면 (복사한 뒤)</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3182f6}a:hover{color:#1b64da}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; font-family: 'Noto Sans KR', sans-serif; color: #191f28; display: flex; flex-direction: column; overflow: hidden; position: relative"><div style="height: 54px; flex: none; background: #f2f4f6; display: flex; align-items: flex-end; padding: 0 14px 8px"><div style="flex: 1; height: 34px; border-radius: 10px; background: #e5e8eb; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6b7684"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>kimminho93.github.io</div></div><section style="background: #3182f6; color: #fff; padding: 26px 24px 54px"><span style="font-size: 14px; opacity: 0.85">계좌이체 안내</span><h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 800">우리분식 본점</h1></section>
  <main style="flex: 1; margin-top: -30px; background: #fff; border-radius: 28px 28px 0 0; padding: 26px 22px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #8b95a1">은행</span><span class="num" style="font-size: 18px; font-weight: 800">예시은행</span></div><div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #8b95a1">계좌번호</span><span class="num" style="font-size: 26px; font-weight: 800">1234-56-789012</span></div><div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #8b95a1">예금주 (받는 분)</span><span class="num" style="font-size: 18px; font-weight: 800">우리분식</span></div>
    <p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #4e5968">송금하기 전에 받는 분 이름이 <b>우리분식</b>인지 꼭 확인하세요.</p>
    <div style="flex: 1"></div>
    <div role="status" style="align-self: center; height: 40px; padding: 0 16px; border-radius: 20px; background: #191f28; color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>복사했어요! 이제 송금 앱을 여세요</div>
    <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #8b95a1; text-align: center">복사한 뒤 쓰시는 은행 앱이나 토스·카카오페이를 열면 계좌번호를 붙여 넣을 수 있어요.</p>
  </main>
  <div style="padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="height: 56px; border-radius: 16px; border: 0; background: #e8f3ff; color: #1b64da; font: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>복사 완료</button>
    <button type="button" style="height: 46px; border-radius: 16px; border: 0; background: #f2f4f6; color: #4e5968; font: inherit; font-size: 15px; font-weight: 700">은행 이름까지 복사</button>
  </div></div>
</body>
</html>
