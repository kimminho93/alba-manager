<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 J 손님 화면</title>
<!-- 디자인 시안(정적 목업). 실제 앱 코드가 아님. 예시 데이터만 들어 있음. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Inter:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3182f6}a:hover{color:#1b64da}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f2f4f6; font-family: 'Noto Sans KR', sans-serif; color: #191f28; display: flex; flex-direction: column; overflow: hidden; position: relative"><div style="height: 54px; flex: none; background: #f2f4f6; display: flex; align-items: flex-end; padding: 0 14px 8px"><div style="flex: 1; height: 34px; border-radius: 10px; background: #e5e8eb; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; color: #6b7684"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>kimminho93.github.io</div></div><main style="flex: 1; padding: 26px 18px 0; display: flex; flex-direction: column; gap: 16px; background: #f2f4f6">
    <div style="padding: 0 4px"><span style="font-size: 14px; color: #6b7684">우리분식 본점</span><h1 style="margin: 2px 0 0; font-size: 24px; font-weight: 800">계좌이체 안내</h1></div>
    <section style="background: #191f28; color: #fff; border-radius: 24px; padding: 22px">
      <div style="display: flex; justify-content: space-between; font-size: 14px; color: #b0b8c1"><span>예시은행</span><span>예금주 <b style="color: #fff">우리분식</b></span></div>
      <div class="num" style="margin-top: 14px; font-size: 28px; font-weight: 800">1234-56-789012</div>
      <button type="button" style="margin-top: 20px; width: 100%; height: 52px; border-radius: 14px; border: 0; background: #3182f6; color: #fff; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>계좌번호 복사</button>
      <button type="button" style="margin-top: 8px; width: 100%; height: 44px; border-radius: 14px; border: 0; background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 14px; font-weight: 700">은행 이름까지 복사</button>
    </section>
    <section style="background: #fff; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; gap: 12px"><span class="num" style="width: 28px; height: 28px; border-radius: 14px; background: #e8f3ff; color: #1b64da; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">1</span><span style="font-size: 15px; font-weight: 600">아래 버튼으로 계좌번호 복사</span></div><div style="display: flex; align-items: center; gap: 12px"><span class="num" style="width: 28px; height: 28px; border-radius: 14px; background: #e8f3ff; color: #1b64da; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">2</span><span style="font-size: 15px; font-weight: 600">은행 앱이나 토스·카카오페이 열기</span></div><div style="display: flex; align-items: center; gap: 12px"><span class="num" style="width: 28px; height: 28px; border-radius: 14px; background: #e8f3ff; color: #1b64da; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none">3</span><span style="font-size: 15px; font-weight: 600">받는 계좌에 붙여 넣기</span></div></section>
    <p style="margin: 0 4px; padding: 12px 14px; border-radius: 14px; background: #fff4e5; color: #8a4b00; font-size: 14px; line-height: 1.5">송금하기 전에 받는 분 이름이 <b>우리분식</b>인지 꼭 확인하세요.</p>
  </main></div>
</body>
</html>
