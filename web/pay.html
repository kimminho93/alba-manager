<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>계좌이체 안내</title>
  <link rel="stylesheet" href="./pay.css?v=202611290200">
</head>
<body>
  <main class="pay">
    <div id="store" class="store"></div>
    <div id="sub" class="sub">계좌이체 안내</div>
    <div id="ok" hidden>
      <dl class="info">
        <div><dt id="lBank">은행</dt><dd id="bank"></dd></div>
        <div><dt id="lNo">계좌번호</dt><dd id="no" class="no"></dd></div>
        <div><dt id="lHolder">예금주</dt><dd id="holder"></dd></div>
      </dl>
      <p id="check" class="check">송금하기 전에 받는 분 이름이 <b id="holder2"></b> 인지 꼭 확인하세요.</p>
      <button id="copyNo" type="button" class="btn primary">계좌번호 복사</button>
      <button id="copyAll" type="button" class="btn">은행 이름까지 복사</button>
      <p id="done" class="done" role="status" aria-live="polite"></p>
      <p id="howto" class="howto">복사한 뒤 쓰시는 은행 앱이나 토스·카카오페이를 열면 계좌번호를 붙여 넣을 수 있어요.</p>
    </div>
    <p id="bad" class="bad" hidden>안내 정보를 읽을 수 없어요. 매장에 계좌번호를 직접 물어봐 주세요.</p>
  </main>
  <script src="./pay.js?v=202611290200"></script>
</body>
</html>
